name: CD (simulado)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      IMAGE: lab40
      TAG: feature07-${{ github.sha }}
      CONTAINER_NAME: lab40-cd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação reproduzível
        run: npm ci

      - name: Verificações antes da entrega (formatação, lint, testes, smoke, auditoria)
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run test:smoke
          npm audit --audit-level=high

      - name: Build da imagem Docker
        run: |
          docker build --pull -t "$IMAGE:$TAG" -t "$IMAGE:feature07" .
          docker images "$IMAGE"
          echo "IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE:$TAG")" >> "$GITHUB_ENV"

      - name: Executar container e validar /health e endpoint
        run: |
          CONTAINER_ID=$(docker run -d --name "$CONTAINER_NAME" -p 3000:3000 "$IMAGE:$TAG")
          echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"
          echo "Container ID: $CONTAINER_ID"
          docker ps --filter "id=$CONTAINER_ID" | tee docker-ps.txt
          for i in $(seq 1 20); do
            curl --silent --fail http://localhost:3000/health && break
            sleep 1
          done
          curl --fail http://localhost:3000/health | tee health.json
          echo
          curl --fail -X POST http://localhost:3000/api/features/7 \
            -H "Content-Type: application/json" -d '{"numero":17}' | tee response.json
          echo
          grep -q '"primo":true' response.json

      - name: Logs do container
        if: always()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Encerrar container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true

      - name: Empacotar imagem e registro de entrega
        run: |
          mkdir -p delivery
          docker save "$IMAGE:$TAG" -o delivery/lab40-feature07.tar
          {
            echo "LAB40 - Registro de entrega (CD simulado)"
            echo "Repositorio:     ${{ github.repository }}"
            echo "Referencia:      ${{ github.ref }}"
            echo "Commit SHA:      ${{ github.sha }}"
            echo "Feature:         07 - Verificador de numero primo"
            echo "Imagem/tag:      $IMAGE:$TAG"
            echo "Image ID:        $IMAGE_ID"
            echo "Container ID:    $CONTAINER_ID"
            echo "Container nome:  $CONTAINER_NAME"
            echo "Arquivo imagem:  lab40-feature07.tar ($(du -h delivery/lab40-feature07.tar | cut -f1))"
            echo "SHA256 do .tar:  $(sha256sum delivery/lab40-feature07.tar | cut -d' ' -f1)"
            echo "Evento:          ${{ github.event_name }}"
            echo "Executado por:   ${{ github.actor }}"
            echo "Workflow run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Data (UTC):      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Health check:    $(cat health.json)"
            echo "POST /api/features/7: $(cat response.json)"
            echo
            echo "docker ps:"
            cat docker-ps.txt
          } > delivery/deployment-record.txt
          cat delivery/deployment-record.txt

      - name: Implantação simulada
        run: echo "Entrega simulada da imagem $IMAGE:$TAG (container $CONTAINER_ID) concluída. Nenhum serviço externo foi utilizado."

      - name: Publicar artefato da entrega
        uses: actions/upload-artifact@v4
        with:
          name: lab40-delivery-record
          path: delivery/
          retention-days: 7
